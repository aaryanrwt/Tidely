name: Tidely CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Tidely with all optional dependencies
        run: pip install -e ".[all,bench]"

      - name: Install development dependencies
        run: |
          pip install ruff mypy pytest pytest-cov types-pyyaml hypothesis psutil

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Ruff
        run: ruff format --check .

      - name: Type check with MyPy
        run: mypy src/tidely --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          coverage run -m pytest tests/ -q --tb=short
          coverage report --fail-under=70

      - name: Benchmark smoke test
        run: python benchmarks/run_benchmark.py --smoke-test

      - name: Check benchmark regression
        run: python benchmarks/run_benchmark.py --check-regression
